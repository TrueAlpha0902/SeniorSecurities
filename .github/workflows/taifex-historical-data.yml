name: TAIFEX historical data retrieval

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-taifex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch official TAIFEX TXO and TX daily data
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt, hashlib, json, pathlib, time, zipfile, requests
          out = pathlib.Path('taifex_official'); out.mkdir(exist_ok=True)
          s = requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; NCKU-TA-Quant-Research/1.0; academic reproducibility)','Accept':'text/csv,text/plain,*/*','Referer':'https://www.taifex.com.tw/cht/3/optDailyMarketView'})
          datasets={'TXO':['https://www.taifex.com.tw/cht/3/dlOptDataDown','https://www.taifex.com.tw/cht/3/optDataDown'],'TX':['https://www.taifex.com.tw/cht/3/dlFutDataDown','https://www.taifex.com.tw/cht/3/futDataDown']}
          start,end=dt.date(2022,1,1),dt.date(2025,12,31); block_days=28
          manifest={'source':'Taiwan Futures Exchange official daily market data','retrieved_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),'date_from':start.isoformat(),'date_to':end.isoformat(),'files':[]}
          def csv_like(b):
              h=b[:1000].lower(); return len(b)>=100 and b'<html' not in h and b'<!doctype' not in h and (b',' in h or b'\t' in h)
          current=start
          while current<=end:
              block_end=min(current+dt.timedelta(days=block_days-1),end)
              for symbol,urls in datasets.items():
                  payload={'down_type':'1','commodity_id':symbol,'queryStartDate':current.strftime('%Y/%m/%d'),'queryEndDate':block_end.strftime('%Y/%m/%d')}
                  response=selected=None; last=None
                  for url in urls:
                      for method in ('POST','GET'):
                          try:
                              r=s.post(url,data=payload,timeout=90) if method=='POST' else s.get(url,params=payload,timeout=90)
                              r.raise_for_status()
                              if csv_like(r.content): response,selected=r,(r.url if method=='GET' else url); break
                              last=f'non-CSV {method} {url} {len(r.content)}'
                          except Exception as exc: last=f'{method} {url}: {exc!r}'
                          time.sleep(.5)
                      if response is not None: break
                  if response is None: raise RuntimeError(f'Unable to retrieve {symbol} {current}..{block_end}: {last}')
                  fn=f'{symbol}_{current:%Y%m%d}_{block_end:%Y%m%d}.csv'; p=out/fn; p.write_bytes(response.content)
                  manifest['files'].append({'file':fn,'symbol':symbol,'query_start':current.isoformat(),'query_end':block_end.isoformat(),'endpoint':selected,'bytes':len(response.content),'sha256':hashlib.sha256(response.content).hexdigest(),'content_type':response.headers.get('content-type')})
                  print(symbol,current,block_end,len(response.content),selected,flush=True); time.sleep(.8)
              current=block_end+dt.timedelta(days=1)
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          target=pathlib.Path('research/ta_quant/data/taifex_official_2022_2025.zip'); target.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(out.iterdir()): zf.write(p,arcname=p.name)
          print('data_file',target,'bytes',target.stat().st_size,'sha256',hashlib.sha256(target.read_bytes()).hexdigest())
          PY

      - name: Commit official-data archive to isolated research branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/ta_quant/data/taifex_official_2022_2025.zip
          git commit -m "Persist official TAIFEX 2022-2025 research data [skip ci]"
          git push origin HEAD:ta-quant-taifex-data-20260806
